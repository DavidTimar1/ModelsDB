# Build and publish a GitHub Release when a version tag (v*) is pushed.
#
# The FIRST step is a release GATE: it refuses to release unless the pushed tag
# matches the VERSION file, so the tag, the binary's stamped version (build.sh
# injects VERSION via -ldflags), and VERSION itself can never drift apart.
#
# This workflow creates a DRAFT release and holds no signing key. See README
# "Building and releasing" for the local sign-and-publish step.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the Release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches VERSION (release gate)
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION ($file). Bump VERSION + CHANGELOG, then tag v$file."
            exit 1
          fi
          if ! grep -q "\[$file\]" CHANGELOG.md; then
            echo "::warning::No CHANGELOG.md entry found for $file."
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: bash build.sh

      - name: Checksums for the release assets
        # Stable, version-less asset names (modelsdb.exe / modelsdb) so users can
        # download and overwrite their existing binary in place. SHA256SUMS starts
        # with a "# version:" line; the maintainer signs the file on their own
        # machine (go run ./cmd/sign publish), so this job holds no signing key.
        run: |
          v="${GITHUB_REF_NAME#v}"
          go run ./cmd/sign sums -version "$v" -out dist/SHA256SUMS dist/modelsdb.exe dist/modelsdb
          cat dist/SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v ver="$v" '
            $0 ~ ("^## \\[" ver "\\]") { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then echo "Release v$v" > RELEASE_NOTES.md; fi
          echo "--- release notes ---"; cat RELEASE_NOTES.md

      - name: Create draft release
        # A DRAFT: the in-app update never sees it. The maintainer rebuilds from
        # the tag's commit, signs SHA256SUMS and publishes with cmd/sign publish.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/modelsdb.exe
            dist/modelsdb
            dist/SHA256SUMS
